name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, cds ${{ matrix.cds }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        cds: [10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save @sap/cds@${{ matrix.cds }}
      - run: npm run format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      # Timing tests are skipped under coverage, which slows code down; run them without it.
      - run: npm run test:timing
      - name: Build fixture bundle for reviewers
        if: hashFiles('src/build/compile.ts') != ''
        # cds-with-okf.js loads this repo's own plugin (ADR-0005); the commit time keeps it reproducible.
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) npm run cds:okf -- compile test/fixtures/bookshop --to okf -o bundle-preview
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24 && matrix.cds == 10 && hashFiles('bundle-preview/**') != ''
        with:
          name: okf-bundle-preview
          path: bundle-preview

  # Task 4.8: the contract suite through @gavdi/cap-mcp v2 and a real MCP client. Until the plugin
  # is released, it is checked out and built here; set the repository variables
  # CAP_MCP_V2_REPOSITORY (owner/name) and CAP_MCP_V2_REF, and the secret CAP_MCP_V2_TOKEN if that
  # repository is private. Without the variable the job is skipped.
  integrations:
    if: vars.CAP_MCP_V2_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CAP_MCP_V2_REPOSITORY }}
          ref: ${{ vars.CAP_MCP_V2_REF }}
          token: ${{ secrets.CAP_MCP_V2_TOKEN || github.token }}
          path: cap-mcp-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build @gavdi/cap-mcp v2
        working-directory: cap-mcp-v2
        run: npm ci && npm run build
      - run: npm run test:integrations
        env:
          CAP_MCP_V2: ${{ github.workspace }}/cap-mcp-v2
          REQUIRE_CAP_MCP_V2: "1"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Conventional PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
